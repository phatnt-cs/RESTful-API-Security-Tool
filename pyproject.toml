[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restful-api-security-tool"
version = "1.0.0"
description = "Educational tool for RESTful API security testing and vulnerability scanning"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "reportlab>=4.0,<5",
]

[project.scripts]
restful-api-pentest = "restful_api_pentest.cli:main"

[tool.setuptools.packages.find]
include = ["restful_api_pentest*"]
exclude = ["payloads*", "security_lab*", "tests*"]